name: Provision — Google login + sync (one-time)

# Runs a real, visible Chrome on a runner with noVNC + a Cloudflare
# quick tunnel. You open the tunnel URL in YOUR browser, log into
# Google (walusimbileon2@gmail.com), enable Sync (bookmarks,
# history, open tabs, everything), then create a bookmark named
# SYNC-DONE. The job packs the profile and stores it in the
# PRIVATE store repo (browser-profile-store) — every later run
# starts from it.
#
# ⚠️ This repo is PUBLIC. The tunnel URL is masked in logs and
# written to the private store repo (provision-url.txt) instead of
# being printed, so nobody else can grab the live login session.

on:
  workflow_dispatch:
    inputs:
      timeout_min:
        description: "Minutes to wait for your login (default 25)"
        required: false
        default: "25"

permissions:
  contents: write

concurrency:
  group: provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup browser-use + Chrome
        run: bash setup.sh

      - name: Start Chrome (fresh profile)
        run: bash start.sh

      - name: Start noVNC + tunnel
        run: |
          set -euo pipefail
          source config.env
          sudo apt-get install -y -qq x11vnc novnc websockify >/dev/null 2>&1
          sudo x11vnc -display :99 -nopw -forever -shared -rfbport 5900 \
            > /tmp/x11vnc.log 2>&1 &
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 \
            > /tmp/websockify.log 2>&1 &
          sleep 2
          curl -sL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://localhost:6080 --no-autoupdate \
            > /tmp/cf.log 2>&1 &
          # Wait for the trycloudflare URL to appear in the log
          URL=""
          for _ in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "❌ No tunnel URL — cloudflared log:"; tail -20 /tmp/cf.log; exit 1
          fi
          # Mask it in ALL logs + summary — public repo.
          echo "::add-mask::$URL"
          echo "TUNNEL_URL=$URL" >> "$GITHUB_ENV"
          # Deliver the URL privately: write it to the PRIVATE store repo.
          B64=$(printf '%s' "$URL" | base64 -w0)
          gh api -X PUT "repos/$PROFILE_REPO/contents/provision-url.txt" \
            -f message="provision tunnel URL $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f content="$B64" >/dev/null 2>&1 \
            && echo "  ✅ URL written to $PROFILE_REPO (provision-url.txt)" \
            || echo "  ⚠️  could not write provision-url.txt"
          echo "### 🔑 Browser is live — log in:" >> "$GITHUB_STEP_SUMMARY"
          echo "1. The tunnel URL was written to the **private** repo \`$PROFILE_REPO\` (file \`provision-url.txt\`) — open it." >> "$GITHUB_STEP_SUMMARY"
          echo "2. In the desktop: go to accounts.google.com → sign in as **walusimbileon2@gmail.com**." >> "$GITHUB_STEP_SUMMARY"
          echo "3. chrome://settings/syncSetup → **Turn on sync** (Sync everything)." >> "$GITHUB_STEP_SUMMARY"
          echo "4. Create a bookmark named **SYNC-DONE** (Ctrl+D, rename). The job auto-finishes when it appears." >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for login + sync, then pack profile
        env:
          TIMEOUT_MIN: ${{ inputs.timeout_min }}
        run: bash scripts/provision-watch.sh

      - name: Store profile in PRIVATE repo
        run: bash profile.sh upload

      - name: Summary
        run: |
          du -h /tmp/profile.tar.gz | sed 's/^/Stored profile: /'
          echo "✅ Provision complete — synced profile saved to the PRIVATE store repo."
