name: Browse — synced profile session

# Downloads the stored synced profile from the PRIVATE store repo
# (browser-profile-store), starts Chrome with it, runs browser-use,
# then saves the profile back — so sessions and cookies persist
# between runs. Sensitive data never touches this public repo.

on:
  workflow_dispatch:
    inputs:
      use_profile:
        description: "Use the stored synced profile (false = fresh profile test)"
        required: false
        type: boolean
        default: true
      save_profile:
        description: "Pack + upload the profile back to the PRIVATE store repo"
        required: false
        type: boolean
        default: true
      task:
        description: "AI task for browser-use (big-pickle drives Chrome). Empty = smoke test only."
        required: false
        type: string
        default: ""
      publish_repo:
        description: "Publish the artifact (e.g. /tmp/gemini-image.png) as a release here. Empty = skip."
        required: false
        type: string
        default: "Walusimbi-Leon1/browser-use-sync"

permissions:
  contents: write

concurrency:
  group: browse
  cancel-in-progress: false

jobs:
  browse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tailscale (route via EC2 exit node)
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: browser-use-ci
          # Route ALL traffic from this runner through the EC2 node
          # (100.114.90.6) so Google/sites see the EC2's stable IP.
          args: --exit-node=100.114.90.6
          ping: 100.114.90.6

      - name: Verify egress IP (should be EC2's)
        run: |
          echo "Public IP: $(curl -s --max-time 10 https://api.ipify.org)"
          tailscale status | head -8

      - name: Setup browser-use + Chrome
        run: bash setup.sh

      - name: Restore synced profile (from PRIVATE store)
        if: ${{ inputs.use_profile }}
        run: |
          bash profile.sh download || echo "No stored profile yet — continuing fresh."

      - name: Start Chrome
        run: bash start.sh

      - name: Smoke test (bookmarks, history, login, live browser)
        run: |
          set -o pipefail
          source config.env
          "$BROWSER_ENV/bin/browser-use" < scripts/smoke-test.py 2>&1 | tee /tmp/smoke.txt
          grep -A 30 "SMOKE:" /tmp/smoke.txt >> "$GITHUB_STEP_SUMMARY" || true
        env:
          CHROME_PROFILE: /tmp/bu-profile

      - name: AI task (browser-use + big-pickle drives Chrome)
        if: ${{ inputs.task != '' }}
        run: |
          set -o pipefail
          source config.env
          ./browse.sh ai "$TASK" 2>&1 | tee /tmp/ai-task.txt
          grep -a "RESULT:" /tmp/ai-task.txt | tail -2 >> "$GITHUB_STEP_SUMMARY" || true
        env:
          TASK: ${{ inputs.task }}

      - name: Publish artifact as release
        if: ${{ inputs.publish_repo != '' }}
        run: |
          set -euo pipefail
          ART=""
          for f in /tmp/gemini-image.png /tmp/*.png /tmp/*.jpg /tmp/*.jpeg /tmp/*.webp \
                   "$HOME/Downloads"/*.png "$HOME/Downloads"/*.jpg "$HOME/Downloads"/*.jpeg \
                   "$HOME/Downloads"/*.webp /tmp/bu-shots/*.png; do
            [ -f "$f" ] && ART="$f" && break
          done
          echo "artifact: ${ART:-none}"
          if [ -n "$ART" ]; then
            TAG=ai-artifacts
            gh release view "$TAG" --repo "$PUBLISH_REPO" >/dev/null 2>&1 \
              || gh release create "$TAG" --repo "$PUBLISH_REPO" \
                 --title "AI artifacts" --notes "Generated by browser-use (big-pickle)" >/dev/null 2>&1 \
              || true
            gh release upload "$TAG" "$ART" --repo "$PUBLISH_REPO" --clobber 2>&1 \
              && echo "✅ Published: $ART → $PUBLISH_REPO release $TAG"
          else
            echo "⚠️  No artifact found to publish."
          fi
        env:
          PUBLISH_REPO: ${{ inputs.publish_repo }}

      - name: Save profile back (to PRIVATE store)
        if: ${{ inputs.save_profile && always() }}
        run: |
          bash profile.sh pack
          bash profile.sh upload
